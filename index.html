<!DOCTYPE html>
<html lang="zh-Hant-TW"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>八字十神論命</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;background:#f6f3ee;color:#222;font-size:16px;line-height:1.7}
.wrap{max-width:820px;margin:0 auto;padding:12px}h1{font-size:24px;margin:8px 0 2px;color:#7a2a18}.sub{color:#666;font-size:14px;margin:0 0 8px}
h2{font-size:19px;color:#7a2a18;border-bottom:1px solid #d8c9b5;padding-bottom:3px;margin:16px 0 8px}h3{font-size:16px;color:#7a2a18;margin:16px 0 6px}
.card{background:#fff;border:1px solid #e2d8ca;border-radius:10px;padding:14px;margin:10px 0}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:8px 0}.row label{display:flex;flex-direction:column;font-size:13px;color:#666;flex:1 1 140px}
select,input,button{font-size:16px;padding:7px;border:1px solid #bbb;border-radius:6px;background:#fff}
button{background:#7a2a18;color:#fff;border:0;padding:10px 18px;cursor:pointer}
table{border-collapse:collapse;width:100%;font-size:15px}td,th{border:1px solid #e0d6c8;padding:5px;vertical-align:top}th{background:#f3ece2}
table.sg td{text-align:center}table.ln td,table.ln th{white-space:nowrap;text-align:center;font-size:13px}.big2{font-size:22px;font-weight:bold}
.scr{overflow-x:auto;-webkit-overflow-scrolling:touch}.note{font-size:13px;color:#666}.src{font-size:12px;color:#8a6d3b}
.warn{background:#fff4e5;border:1px solid #f0c27b;padding:8px;border-radius:6px;font-size:14px}
.sschart{margin:8px 0}.ssr{display:flex;align-items:center;gap:6px;margin:3px 0;font-size:14px}.ssl{width:3em;flex:none}.ssb{flex:1;background:#f0e9df;border-radius:4px;height:16px;overflow:hidden}.ssb i{display:block;height:100%}.ssv{width:2.6em;text-align:right;flex:none;font-size:13px}.ssg{display:flex;height:22px;border-radius:6px;overflow:hidden;margin-top:8px;font-size:11px;color:#fff;line-height:22px;white-space:nowrap}.ssg i{font-style:normal;text-align:center;overflow:hidden}
#out p{margin:8px 0}h4{font-size:15px;color:#5a3a20;margin:12px 0 4px}.ju{border:1px solid #eadfcf;border-radius:8px;padding:8px 10px;margin:8px 0;background:#fffdf9}.jh{font-size:16px}.vb{display:inline-block;border-radius:10px;padding:0 8px;font-size:13px;color:#fff;background:#888}.v-dj{background:#2e7d32}.v-j{background:#6a9a3a}.v-m{background:#9a7b2a}.v-x{background:#b5652a}.v-dx{background:#a12a1a}td.v-dj,td.v-j,td.v-m,td.v-x,td.v-dx{color:#fff}.hl{color:#a12a1a}details.ref{border:1px solid #e2d8ca;border-radius:8px;margin:8px 0;padding:6px 10px;background:#fffdf9}details summary{cursor:pointer;color:#7a2a18;font-weight:bold}details details summary{font-weight:normal;font-size:14px}.nav{position:sticky;top:0;background:#f6f3eeee;padding:6px 0;z-index:5}.nav a{flex:1 1 auto;text-align:center;background:#7a2a18;color:#fff;border-radius:16px;padding:4px 10px;text-decoration:none;font-size:14px}table.d60 td.wr{white-space:normal;text-align:left;min-width:220px}
@media(max-width:480px){td,th{font-size:13px;padding:3px}.big2{font-size:18px}}
</style></head><body><div class="wrap">
<h1>八字十神論命</h1><p class="sub">以日主為中心，看四柱天干與藏干之十神，論性格、事業、六親、健康傾向與組合格局。</p>
<div class="card">
<div class="row"><label>出生日期（公曆）<input type="date" id="bd" value="1981-03-17"></label><label>出生時間<input type="time" id="bt" value="17:15"></label></div>
<div class="row"><label>性別<select id="sex"><option>男</option><option>女</option></select></label><label>時區 UTC+<input type="number" id="tz" value="8" step="0.5"></label></div>
<div class="row"><span class="note"><input type="checkbox" id="lz" checked> 夜子時（23–24時）日柱換次日</span></div>
<div class="row"><button id="go">排盤論命</button></div>
<div class="note" id="pn"></div>
</div>
<div id="out"></div>
<p class="warn">本站為命理參考，非醫療、法律或投資建議；健康傾向僅屬傳統命理之象，身體不適請就醫。</p>
</div>
<script src="calendar.js"></script><script src="shishen.js"></script><script src="bookdata.js"></script><script src="book.js"></script>
<script>
function $(i){return document.getElementById(i);}
$('go').onclick=function(){var d=$('bd').value,t=$('bt').value||'12:00';if(!d){alert('請輸入出生日期');return;}
 var a=d.split('-').map(Number),b=t.split(':').map(Number),r=CAL.fromSolar(a[0],a[1],a[2],b[0],b[1],parseFloat($('tz').value)||8,$('lz').checked);
 $('pn').textContent='四柱：'+r.pillars.join('　')+(r.note?'（'+r.note+'）':'')+'。節氣以太陽黃經簡算，交節前後數分鐘請人工覆核。';
 var R=SS.calc(r.pillars);$('out').innerHTML='<div class="row nav"><a href="#ssTop">十神分析</a><a href="#bkTop">百局論斷</a><a href="#fq">夫妻宮神煞</a><a href="#ref">講義全文</a></div><div class="card">'+SS.html(r.pillars,$('sex').value)+'</div><div class="card">'+BK.personal(r.pillars,$('sex').value,R)+'</div><div class="card">'+BK.reference()+'</div>';};
</script></body></html>
